name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir -p buildscr
          unzip -q Kunduz_Mines_Visitors_Android_Project_v1.1.zip -d buildscr
      - name:  Fix CSV Kotlin error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/app/src/main/java/af/gov/momp/visitors/MainActivity.kt")
          lines = p.read_text().splitlines()
          lines[228] = r'        v.joinToString("\n"){listOf(it.id,it.name,it.father,it.phone,it.tazkira,it.province,it.district,it.date,it.time,it.department,it.subject,it.responsible,it.note).joinToString(","){ "\""+it.toString().replace("\"","\"\"")+"\"" }}'
          p.write_text("\n".join(lines) + "\n")
          PY
      - name: Add AndroidX properties
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > buildscr/gradle.properties

      - name: Fix Android build settings
        run: |
          cat > buildscr/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "af.gov.momp.visitors"
              compileSdk = 35

              defaultConfig {
                  applicationId = "af.gov.momp.visitors"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: buildscr
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunduz-Mines-Visitors-APK
          path: buildscr/app/build/outputs/apk/debug/app-debug.apk
