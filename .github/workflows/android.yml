name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android project
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p buildsrc
          unzip -o "$ZIP_FILE" -d buildsrc

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/buildsrc" -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        run: |
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

      - name: Fix Java and Kotlin JVM
        run: |
          APP_GRADLE=$(find "$PROJECT_DIR/app" -maxdepth 1 -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "Using: $APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          text = text.replace(
              'jvmTarget.set("1.8")',
              'jvmTarget.set("17")'
          )

          text = text.replace(
              'jvmTarget.set(JvmTarget.JVM_1_8)',
              'jvmTarget.set(JvmTarget.JVM_17)'
          )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          if "tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>" not in text:
              text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Java 17 / Kotlin 17 configuration applied.")
          PY

      - name: Create JVM fix
        run: |
          cat > "$PROJECT_DIR/jvm-fix.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --stacktrace --init-script jvm-fix.gradle

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace --init-script jvm-fix.gradle

      - name: Show APK
        run: |
          echo "===== APK FILES ====="
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunduz-Mines-Visitors-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
